[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "navgent"
version = "0.1.0"
description = "An event-driven browser agent built with LangChain, deepagents, and Playwright."
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.25,<0.8",
    "langgraph>=1.2.15,<2.0",
    "langchain>=1.4.6,<2.0",
    "langchain-core>=1.6.10,<2.0",
    "langchain-openai>=1.7.2,<2.0",
    "langchain-quickjs>=0.3.9,<0.4",
    "playwright>=1.64.0,<2.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "opencv-python-headless>=4.10,<5.0",
    "numpy>=2.0,<3.0",
]

[tool.setuptools.packages.find]
include = ["navgent*"]

[tool.setuptools.package-data]
"navgent.browser" = ["scripts/*.js"]
"navgent.browser_agent" = ["skills/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
timeout = 30

[tool.ruff]
extend-exclude = ["notebooks"]
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["T201", "E501", "UP006", "UP007", "UP040", "E402"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "notebook>=7.6.2",
    "pytest>=8.0.0,<9.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.17",
]
