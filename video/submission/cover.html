<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reprobe cover</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0b0b; }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: #f4f4f4; -webkit-font-smoothing: antialiased; }
  .left { position: absolute; left: 120px; top: 0; bottom: 0; width: 700px; display: flex; flex-direction: column; justify-content: center; }
  .name { font-size: 128px; font-weight: 650; letter-spacing: -0.03em; line-height: 1; }
  .rule { width: 88px; height: 6px; background: #c6f24e; border-radius: 3px; margin: 40px 0 36px; }
  .tag { font-size: 52px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; }
  .sub { margin-top: 30px; font-size: 27px; line-height: 1.45; color: #a3a8ae; max-width: 640px; }
  .right { position: absolute; right: 90px; top: 50%; transform: translateY(-50%); width: 930px; display: flex; flex-direction: column; gap: 26px; }
  .shot { border-radius: 16px; overflow: hidden; border: 1px solid #262b31; box-shadow: 0 30px 70px rgba(0,0,0,.55); background: #111; }
  .shot img { display: block; width: 100%; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .cap { display: flex; align-items: center; gap: 10px; padding: 14px 18px; font-size: 21px; font-weight: 600; border-top: 1px solid #262b31; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .bad { background: #ff5d52; } .good { background: #c6f24e; }
  .muted { color: #8b939e; font-weight: 400; margin-left: auto; font-size: 18px; }
</style>
</head>
<body>
  <div class="left">
    <div class="name">Reprobe</div>
    <div class="rule"></div>
    <div class="tag">Reproduce the bug.<br>Verify the fix.</div>
    <div class="sub">An agent that follows your bug report in a real browser, inside a disposable sandbox, and comes back with proof.</div>
  </div>
  <div class="right">
    <div class="pair">
      <div class="shot"><img src="img/calendar-bug.png" alt=""><div class="cap"><span class="dot bad"></span>Check 1 · Reproduced<span class="muted">before the fix</span></div></div>
      <div class="shot"><img src="img/calendar-after-fix.png" alt=""><div class="cap"><span class="dot good"></span>Check 2 · Not reproduced<span class="muted">after</span></div></div>
    </div>
    <div class="shot"><img src="img/history.png" alt=""></div>
  </div>
<script>window.seek = function () {}; window.DURATION = 0; window.AUDIO_CUES = [];</script>
</body>
</html>
