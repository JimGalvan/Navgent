<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0c0c0d" />
    <title>New reproduction · Reprobe</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script type="module" src="/static/ui.js"></script>
  </head>
  <body data-page="new">
    <header class="top" data-app-header></header>
    <div id="preview-banner" class="preview-banner" hidden>
      <span>Design preview · sample data, no agent execution</span
      ><a href="/preview/new">New</a><a href="/preview/live">Live</a
      ><a href="/preview/report">Report</a>
    </div>
    <main class="narrow">
      <div class="intro">
        <h1>Show the bug. Get the proof.</h1>
        <p class="muted">Add steps, screenshots or a recording to reproduce the bug.</p>
      </div>
      <form id="reproduction-form">
        <section class="section">
          <h2 class="section-title">Evidence</h2>
          <div class="field">
            <label for="steps">Steps <span class="optional">Optional</span></label>
            <textarea id="steps" rows="4" maxlength="6000" placeholder="1. Open the cart page&#10;2. Apply the discount&#10;3. Remove one item&#10;4. Check the total"></textarea>
          </div>
          <div class="two-col uploads">
            <div>
              <label class="upload-label" for="shot-files">Screenshots <span class="optional">Optional</span></label>
              <div class="drop" data-drop="shots">
                <label for="shot-files">Drop images or <span class="upload-link">browse</span></label>
                <p class="muted">Up to 10 images · 10 MB each</p>
                <input id="shot-files" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/tiff,.tif,.tiff" multiple class="file-input" />
              </div>
            </div>
            <div>
              <label class="upload-label" for="video-files">Video <span class="optional">Optional</span></label>
              <div class="drop" data-drop="video">
                <label for="video-files">Drop a recording or <span class="upload-link">browse</span></label>
                <p class="muted">MP4, WebM, MOV · 2 min · 50 MB</p>
                <input id="video-files" type="file" accept="video/mp4,video/webm,video/quicktime" class="file-input" />
              </div>
            </div>
          </div>
          <div id="file-list" class="file-list"></div>
          <p id="media-note" class="notice" hidden></p>
          <div class="field">
            <label for="target-url">App URL</label>
            <input class="mono" id="target-url" type="url" required placeholder="https://staging.your-app.com" maxlength="1000" />
          </div>
          <div class="two-col">
            <div class="field">
              <label for="expected">Expected</label>
              <textarea id="expected" rows="2" required maxlength="1200" placeholder="What should happen?"></textarea>
            </div>
            <div class="field">
              <label for="actual">Actual <span class="optional">Optional</span></label>
              <textarea id="actual" rows="2" maxlength="1200" placeholder="What happened instead?"></textarea>
            </div>
          </div>
        </section>
        <div class="actions form-footer">
          <span class="mono muted">Browser session · 10 minute limit</span>
          <button class="button" id="start-run" type="submit">Start reproduction</button>
        </div>
        <p id="form-message" class="message" role="status"></p>
      </form>
      <section class="section">
        <h2 class="section-title">Recent</h2>
        <div id="history"><p class="empty">Loading your runs…</p></div>
      </section>
    </main>
  </body>
</html>
