<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0c0c0d" />
    <title>Your reports · Reprobe</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script type="module" src="/static/ui.js"></script>
  </head>
  <body data-page="reports">
    <header class="top">
      <a class="brand" href="/">Reprobe</a>
      <nav aria-label="Primary">
        <a data-nav="new" href="/app">New</a
        ><a data-nav="live" href="/app">Live</a
        ><a data-nav="reports" href="/app/reports">Reports</a
        ><span id="account-email" class="account-name muted"></span
        ><a id="logout" href="/logout">Log out</a>
      </nav>
    </header>
    <div id="preview-banner" class="preview-banner" hidden>
      <span>Design preview · sample data, no agent execution</span
      ><a href="/preview/new">New</a><a href="/preview/live">Live</a
      ><a href="/preview/report">Report</a>
    </div>
    <main class="narrow">
      <div class="actions" style="margin-top: 0">
        <h1>Your reports.</h1>
        <a class="button" href="/app">New reproduction</a>
      </div>
      <p class="muted">
        A record of your browser runs, their output, and the evidence available.
      </p>
      <p id="history-message" class="message" role="status"></p>
      <section class="section">
        <h2 class="section-title">Reproductions</h2>
        <div id="history"><p class="empty">Loading your runs…</p></div>
      </section>
    </main>
  </body>
</html>
